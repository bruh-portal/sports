<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b16">
<title>DMF SPORTS</title>
<style>
:root{
 --bg:#070b16;--panel:#111b2e;--line:#293750;
 --muted:#91a0bb;--cyan:#62e5ff;--blue:#638cff;
 --txt:#f3f6ff;--green:#42f5a1;
}
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at 70% -20%,#203b70,transparent 43%),var(--bg);
 color:var(--txt);font:14px system-ui,Arial;min-height:100vh
}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}
aside{
 height:100vh;position:sticky;top:0;overflow:auto;
 background:#080e1c;border-right:1px solid var(--line);padding:18px 12px
}
.brand{padding:8px;font-weight:950;letter-spacing:3px;font-size:18px;margin-bottom:22px}
.brand span{color:var(--cyan)}
.navlabel{font-size:9px;letter-spacing:2px;color:#7183a3;padding:13px 9px 7px}
nav{display:grid;gap:4px}
nav button{
 background:transparent;border:1px solid transparent;color:#adbad0;
 text-align:left;padding:10px;border-radius:10px
}
nav button:hover,nav button.active{background:#526eff26;border-color:#6688ff66;color:white}
nav button span{display:inline-block;width:25px}
main{min-width:0;padding:22px clamp(13px,3vw,40px) 50px;max-width:1500px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.crumb{font-size:11px;color:var(--muted)}
.searchwrap{position:relative;width:min(470px,65vw)}
input{
 background:#111b2e;border:1px solid #34425e;border-radius:12px;
 padding:12px;color:white;outline:none
}
input:focus{border-color:var(--cyan)}
#search{width:100%}
#results{
 display:none;position:absolute;top:calc(100% + 7px);left:0;right:0;
 background:#101a2d;border:1px solid #405273;border-radius:13px;
 z-index:20;overflow:hidden;max-height:400px;overflow-y:auto
}
#results.show{display:block}
.result{
 width:100%;display:flex;align-items:center;gap:10px;text-align:left;
 background:none;border:0;padding:12px;border-bottom:1px solid #ffffff12
}
.result:hover{background:#ffffff12}
.result small{display:block;color:var(--muted)}
.page{display:none}
.page.active{display:block}
.hero{
 position:relative;overflow:hidden;border:1px solid #526dff66;
 border-radius:24px;padding:36px;
 background:linear-gradient(115deg,#192d50,#111c34 65%,#10182b);
 margin-bottom:22px;min-height:330px;isolation:isolate
}
.hero:before{
 content:"";position:absolute;width:500px;height:500px;border-radius:50%;
 right:-80px;top:-190px;
 background:radial-gradient(circle,#35dfff19,transparent 65%);
 z-index:-1
}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:900}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:15px 0;letter-spacing:-2px}
.hero h1 span{color:var(--cyan)}
.hero p{color:#b4c2dc;max-width:480px;line-height:1.7}
.primary,.secondary{border-radius:10px;padding:11px 15px;font-weight:800}
.primary{border:0;background:linear-gradient(100deg,#586dff,#36c8ed)}
.secondary{background:#ffffff0c;border:1px solid #8ca6d455}
/* BALÓN CINEMÁTICO */
.ball-scene{
 position:absolute;right:2%;top:0;width:48%;height:100%;
 display:grid;place-items:center;pointer-events:none;overflow:hidden
}
.ball-glow{
 position:absolute;width:240px;height:240px;border-radius:50%;
 background:radial-gradient(circle,#35dfff38,transparent 68%);
 animation:glow 3s ease-in-out infinite alternate
}
.ball-orbit{
 position:absolute;width:300px;height:110px;border:1px solid #56eaff35;
 border-radius:50%;transform:rotate(-25deg);
 box-shadow:0 0 25px #35dfff15
}
.ball-orbit.two{width:350px;height:150px;transform:rotate(28deg);border-color:#57a0ff30}
.ball{
 position:relative;width:125px;height:125px;border-radius:50%;
 background:
 radial-gradient(circle at 35% 25%,#fff 0%,#dfeeff 25%,#879bb4 55%,#28364d 100%);
 box-shadow:0 15px 40px #0009,0 0 40px #5cecff66;
 animation:ballFly 4.5s cubic-bezier(.45,.05,.25,1) infinite;
 transform-style:preserve-3d
}
.ball:before{
 content:"";position:absolute;inset:0;border-radius:50%;
 background:
 linear-gradient(35deg,transparent 38%,#172238 39% 44%,transparent 45%),
 linear-gradient(145deg,transparent 28%,#172238 29% 34%,transparent 35%),
 linear-gradient(80deg,transparent 65%,#172238 66% 70%,transparent 71%);
 clip-path:circle(50%)
}
.ball:after{
 content:"";position:absolute;inset:16px;border:2px solid #26344c;
 border-radius:50%;opacity:.65
}
.trail{
 position:absolute;width:230px;height:28px;right:50%;
 background:linear-gradient(90deg,transparent,#47eaff88,#9cf8ff);
 filter:blur(10px);transform:rotate(-24deg);
 animation:trail 4.5s ease-in-out infinite
}
.spark{
 position:absolute;width:5px;height:5px;background:#8ffaff;
 border-radius:50%;box-shadow:0 0 15px #8ffaff;
 animation:spark 2s ease-in-out infinite
}
.spark.s1{right:25%;top:25%}.spark.s2{right:10%;top:70%;animation-delay:.5s}
.spark.s3{right:60%;top:35%;animation-delay:1s}
@keyframes ballFly{
 0%,12%{transform:translate(-55px,65px) rotate(-35deg) scale(.8)}
 35%{transform:translate(0,0) rotate(90deg) scale(1.05)}
 53%{transform:translate(65px,-48px) rotate(220deg) scale(1.12)}
 72%{transform:translate(115px,-5px) rotate(390deg) scale(.92)}
 100%{transform:translate(-55px,65px) rotate(685deg) scale(.8)}
}
@keyframes trail{
 0%,20%{opacity:0;transform:translateX(-35px) rotate(-24deg)}
 38%,58%{opacity:1;transform:translateX(0) rotate(-24deg)}
 78%,100%{opacity:0;transform:translateX(70px) rotate(-24deg)}
}
@keyframes glow{to{transform:scale(1.3);opacity:.5}}
@keyframes spark{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.5)}}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.sectionhead h2{font-size:18px;margin:0}
.sectionhead p{color:var(--muted);font-size:11px;margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.compgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.panel,.sportcard,.compcard{
 background:linear-gradient(145deg,#141f34,#0e1728);
 border:1px solid var(--line);border-radius:14px;padding:14px
}
.sportcard,.compcard{text-align:left;transition:.2s}
.notice{font-size:10px;color:#b0c2dc;background:#18243a;padding:11px;border-left:2px solid var(--cyan);border-radius:0 9px 9px 0}
.pitch{position:relative;max-width:680px;margin:12px auto;background:linear-gradient(135deg,#174d3b,#0c382c);border:2px solid #8ad8a466;border-radius:12px;aspect-ratio:16/9;overflow:hidden}
.pitch:before{content:"";position:absolute;inset:8%;border:1px solid #d6ffe477}
.pitch:after{content:"";position:absolute;left:50%;top:8%;bottom:8%;border-left:1px solid #d6ffe477}
.circle{position:absolute;left:50%;top:50%;width:23%;aspect-ratio:1;border:1px solid #d6ffe477;border-radius:50%;transform:translate(-50%,-50%)}
.boxleft,.boxright{position:absolute;top:28%;height:44%;width:14%;border:1px solid #d6ffe477}
.boxleft{left:8%}.boxright{right:8%}
.pitchball{position:absolute;left:49%;top:49%;font-size:18px;animation:floatball 2.5s ease-in-out infinite alternate}
@keyframes floatball{to{transform:translate(32px,-13px) rotate(140deg)}}
.standings{width:100%;border-collapse:collapse;font-size:11px}
.standings td,.standings th{padding:9px 7px;text-align:left;border-bottom:1px solid #ffffff12}
.standings th{color:var(--muted);font-size:9px}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:#7184a5;font-size:10px}
@media(max-width:850px){.app{grid-template-columns:190px 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){
 .app{display:block}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:65px;padding:4px;z-index:10;border-right:0;border-top:1px solid var(--line)}
 .brand,.navlabel{display:none}
 nav{display:flex;height:100%;justify-content:space-around}
 nav button{flex:1;text-align:center;padding:4px 1px;font-size:8px;display:flex;flex-direction:column;align-items:center;gap:1px}
 nav button span{width:auto;font-size:16px}
 main{padding:13px 11px 85px}
 .hero{padding:23px 17px;min-height:260px}
 .hero h1{font-size:32px;max-width:80%}
 .hero p{font-size:11px;max-width:75%}
 .ball-scene{right:-10%;width:55%;opacity:.85}
 .ball{width:85px;height:85px}
 .ball-orbit{width:210px;height:80px}
  <input id="search" placeholder="Busca un equipo, liga o deporte..." autocomplete="off">
  <div id="results"></div>
 </div>
</header>

function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(id,label){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 $(id).classList.add('active');$('crumb').textContent=label;
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
}
function card(c){return `<button class="compcard" data-comp="${c.id}"><span class="big">${c.icon}</span><span><b>${esc(c.name)}</b><small>${esc(c.country)} · ${esc(sports.find(s=>s.id===c.sport).name)}</small></span></button>`}
